<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Christian Lara — Ingeniero de Sistemas & Desarrollador Full-Stack</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portafolio de Christian Lara, Ingeniero de Sistemas y desarrollador Full-Stack especializado en Angular, Spring Boot y Node.js. Experiencia en APIs REST, accesibilidad WCAG AA y CI/CD."
    />
    <meta name="author" content="Christian Lara" />
    <meta name="theme-color" content="#0d0d14" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Christian Lara — Ingeniero de Sistemas & Desarrollador Full-Stack"
    />
    <meta
      property="og:description"
      content="Portafolio personal: experiencia, proyectos, especialidades y formación de Christian Lara, desarrollador Full-Stack con Angular, Spring Boot y Node.js."
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica el tema guardado antes del primer pintado para evitar destellos. -->
    <script>
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
